<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nõn Sợi - Khăn & Áo choàng tắm cao cấp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/home.css" rel="stylesheet" />
  <link href="css/products.css" rel="stylesheet" />
</head>

<body>
  <div id="header-placeholder"></div>

  <section class="hero-section">
    <div class="hero-content">
    </div>
  </section>

  <section id="new-products" class="new-products container my-5" data-product-filter="new" data-product-limit="3">

    <!-- Khu vực logo và nội dung giới thiệu -->
    <div class="new-products-header text-center mb-5">
      <!-- Thêm logo tại đây -->
      <img src="images/logo/logo-text.png" alt="Logo" class="new-products-logo">

      <!-- Nội dung bên dưới logo -->
      <p class="new-products-description">
        Hành Trình Trong Từng Thớ Sợi
      </p>
    </div>

  </section>

  <button class="back-to-top" id="backToTop" title="Lên đầu trang"><i class="bi bi-chevron-up"></i></button>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
  <script src="js/product-data.js"></script>
  <script src="js/product-renderer.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>

  <script>
    $(document).ready(function () {
      $('#header-placeholder').load('components/header.html', function () {
        if (typeof window.initializeHeaderComponents === 'function') window.initializeHeaderComponents();
        if (typeof setActiveNavItem === 'function') setActiveNavItem();
      });
      $('#footer-placeholder').load('components/footer.html');
    });
  </script>
</body>

</html>
